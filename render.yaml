services:
  - type: web
    name: delta-ai-trading-bot-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DELTA_BASE_URL
        value: https://api.india.delta.exchange
